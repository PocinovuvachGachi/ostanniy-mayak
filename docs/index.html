<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1418">
<meta name="description" content="Медитативна піксельна гра про хранителя згаслого маяка.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Останній Маяк</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=IBM+Plex+Mono:wght@400;600&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: keeper's logbook. Sticky resource strip, tab row, one working column. ASCII art carries the world; the tower lighting up floor by floor is the hero element. */
:root{
  --bg:#e2e8e5; --panel:#f4f6f3; --ink:#15242c; --mute:#566870; --rule:#bac8c5;
  --lamp:#a85d08; --sea:#235e78; --seabg:#cddbdc; --land:#dcd8c9; --bad:#a3322b; --good:#2d7147;
  --npc:#8f2f63; --c-ember:#b8560b; --c-wood:#7f5426; --c-scrap:#4e5f6c; --c-oil:#7f6d0e; --c-fish:#17707b; --c-herb:#3b7428; --c-lore:#62469a; --c-coin:#8d6a00; --c-iron:#55626f; --c-tar:#3a3530; --c-prov:#8a5a2e; --note:#ece4cf; --noteInk:#2b2418; --hand:"Caveat","Segoe Print",cursive;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d171c; --panel:#13212a; --ink:#dbe6e8; --mute:#8ba1a9; --rule:#2a3e48;
  --lamp:#f0a33a; --sea:#85c2d8; --seabg:#0f242d; --land:#1d2d2f; --bad:#ee8a80; --good:#80cf9a;
  --npc:#f09cc6; --c-ember:#ff9d4d; --c-wood:#d6a571; --c-scrap:#a9bac6; --c-oil:#e2cd57; --c-fish:#6fd0dc; --c-herb:#98d47c; --c-lore:#bba3ec; --c-coin:#f2cc55; --c-iron:#c3ccd6; --c-tar:#b9ab9a; --c-prov:#e0a874; --note:#2c2a22; --noteInk:#eadfc4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d171c; --panel:#13212a; --ink:#dbe6e8; --mute:#8ba1a9; --rule:#2a3e48;
  --lamp:#f0a33a; --sea:#85c2d8; --seabg:#0f242d; --land:#1d2d2f; --bad:#ee8a80; --good:#80cf9a;
  --npc:#f09cc6; --c-ember:#ff9d4d; --c-wood:#d6a571; --c-scrap:#a9bac6; --c-oil:#e2cd57; --c-fish:#6fd0dc; --c-herb:#98d47c; --c-lore:#bba3ec; --c-coin:#f2cc55; --c-iron:#c3ccd6; --c-tar:#b9ab9a; --c-prov:#e0a874; --note:#2c2a22; --noteInk:#eadfc4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--serif)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
h1{font:700 1.7rem/1.15 var(--serif);margin:0;text-wrap:balance}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);padding:8px 0;margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 16px;font:14px/1.4 var(--mono);font-variant-numeric:tabular-nums}
#top small{color:var(--mute)}
#tabs{display:flex;flex-wrap:wrap;gap:0 16px;margin:10px 0 0;border-bottom:1px solid var(--rule)}
#tabs:empty{display:none}
#tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;margin:0 0 -1px;padding:6px 0;font:600 15px/1.3 var(--serif);color:var(--mute)}
#tabs button:hover:not(:disabled){background:none;color:var(--ink)}
#tabs button.on{color:var(--ink);border-bottom-color:var(--lamp)}
#tabs button.new::after{content:"!";display:inline-block;margin-left:5px;min-width:16px;height:16px;border-radius:50%;background:var(--lamp);color:var(--panel);font:700 11px/16px var(--mono);text-align:center;vertical-align:2px}
#tip{position:fixed;z-index:60;display:none;max-width:300px;background:var(--ink);color:var(--panel);padding:8px 10px;font:13px/1.45 var(--serif);box-shadow:0 6px 20px rgba(0,0,0,.3);pointer-events:none}
#tip b{color:var(--lamp)}
.gl{border-bottom:1px dotted currentColor;cursor:help}
.beats{margin:4px 0 2px;padding-left:18px}.tl .beats li{margin:3px 0;padding:0}.tl .beats b{font-size:1rem}
.tscroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
.ttree{position:relative;min-width:720px;background:var(--bg);border:1px solid var(--rule)}
.ttree rect.band{fill:var(--panel);opacity:.55}
.ttree svg{position:absolute;inset:0;width:100%;height:100%}
.ttree line{stroke:var(--rule);stroke-width:2;vector-effect:non-scaling-stroke}
.ttree line.on{stroke:var(--good)}.ttree line.soft{stroke-dasharray:3 4}
.ttree .tn{position:absolute;transform:translate(-50%,-50%);width:15%;min-height:34px;padding:4px 6px;font:600 12px/1.25 var(--serif);background:var(--panel);border:1px solid var(--rule);color:var(--mute);white-space:normal}
.ttree .tn.taken{border:2px solid var(--good);color:var(--ink)}
.ttree .tn.avail{border:2px solid var(--lamp);color:var(--ink)}
.ttree .tn.sel{box-shadow:0 0 0 3px var(--lamp)}
.ttree .tn .abt{display:block;font:10px/1.2 var(--mono);color:var(--mute);margin-top:2px}
.ttree .bl{position:absolute;left:8px;transform:translateY(-50%);font:600 12px/1.25 var(--serif);color:var(--sea);width:11%}
.ttree .tlv{position:absolute;top:6px;transform:translateX(-50%);font:11px var(--mono);color:var(--mute);white-space:nowrap}
.tdet{margin-top:12px;border:1px solid var(--rule);border-left:4px solid var(--lamp);padding:10px 12px;background:var(--panel)}
.need{margin:4px 0 0;padding-left:18px}.need li{color:var(--bad)}
.event{margin:10px 0 12px;min-height:1.55em;display:flex;gap:8px;align-items:baseline}
section{background:var(--panel);border:1px solid var(--rule);padding:14px 16px;margin-bottom:12px}
h2{font:600 1.1rem/1.3 var(--serif);margin:0 0 8px;color:var(--sea);text-wrap:balance}
h3{font:600 1.02rem/1.3 var(--serif);margin:0 0 4px}
p{margin:0 0 8px}
.m{color:var(--mute);font-size:.92rem}
button{font:14px/1.3 var(--mono);color:var(--ink);background:transparent;border:1px solid var(--ink);padding:6px 10px;border-radius:2px;cursor:pointer;margin:2px 6px 2px 0;position:relative;overflow:hidden;text-align:left;max-width:100%}
button:hover:not(:disabled){background:var(--ink);color:var(--panel)}
button:hover:not(:disabled) .rs{color:inherit}
button:disabled{opacity:.38;cursor:default}
button:focus-visible,[role=button]:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
button.cd::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p,0)*100%);background:var(--lamp)}
button.main{border-width:2px;font-weight:600}
button.on{background:var(--ink);color:var(--panel)}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;padding:9px 0;border-top:1px dashed var(--rule)}
.row:first-of-type{border-top:0;padding-top:2px}
.row>div{min-width:0;flex:1 1 240px}
.act{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:4px 0}
.chk{font:12px/1.4 var(--mono);padding:1px 6px;border:1px solid currentColor;border-radius:2px;white-space:nowrap}
.chk.ok{color:var(--good)}.chk.no{color:var(--bad)}
.done{color:var(--good);font:13px var(--mono)}
.bar{height:8px;background:var(--rule);margin:3px 0 8px}
.bar i{display:block;height:100%;background:var(--bad);transition:width .25s}
.bar.xp i{background:var(--good)}
.home{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:620px){.home{grid-template-columns:minmax(0,1fr)}}
pre{font:14px/1.18 var(--mono);margin:0}
pre.tower{font-size:15px;padding:6px 4px;color:var(--rule);overflow-x:auto}
pre.tower .lit{color:var(--ink)}
.sea{color:var(--sea)}
pre.art{color:var(--mute);overflow-x:auto;margin:0 0 10px;padding:8px 0;border-bottom:1px dashed var(--rule)}
.glow{color:var(--lamp)!important;text-shadow:0 0 6px var(--lamp)}
@media (prefers-reduced-motion:no-preference){.glow{animation:flick 2.6s ease-in-out infinite}}
@keyframes flick{0%,100%{opacity:1}45%{opacity:.62}60%{opacity:.9}}
.big{font:600 2.1rem/1 var(--mono);font-variant-numeric:tabular-nums;margin-bottom:4px;color:var(--c-ember)}
.banner{background:var(--panel);border:1px solid var(--lamp);border-left:4px solid var(--lamp);padding:12px 16px;margin:10px 0 12px}
.banner b{display:block;font-size:1.08rem;margin-bottom:4px;color:var(--lamp)}
.sub{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
/* text styling */
.rs{font-family:var(--mono);font-size:.94em;white-space:nowrap}
.rs-ember{color:var(--c-ember)}.rs-wood{color:var(--c-wood)}.rs-scrap{color:var(--c-scrap)}.rs-oil{color:var(--c-oil)}.rs-fish{color:var(--c-fish)}.rs-herb{color:var(--c-herb)}.rs-lore{color:var(--c-lore)}.rs-coin{color:var(--c-coin)}.rs-iron{color:var(--c-iron)}.rs-tar{color:var(--c-tar)}.rs-prov{color:var(--c-prov)}
#top .rs b{font-weight:600}
.npc{color:var(--npc);font-weight:600}
.itm{font-weight:600;border-bottom:1px dotted var(--lamp)}
.foe{color:var(--bad);font-weight:600}
.pl{color:var(--sea);font-weight:600}
.q{font-style:italic}
.tag{font:11px/1.6 var(--mono);letter-spacing:.03em;padding:0 6px;border:1px solid currentColor;border-radius:2px;white-space:nowrap;flex:none}
.t-find{color:var(--c-coin)}.t-fight{color:var(--bad)}.t-story{color:var(--lamp)}.t-lvl{color:var(--good)}.t-world{color:var(--sea)}.t-info{color:var(--mute)}
.ev-text{min-width:0}
/* places */
.spot{display:flex;gap:14px;align-items:flex-start}
.spot pre.face{color:var(--npc);flex:none;padding-top:2px}
.spot>div{min-width:0;flex:1}
/* inventory */
.doll{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:560px){.doll{grid-template-columns:minmax(0,1fr)}}
.slots{display:grid;gap:6px}
.slot{display:flex;gap:10px;align-items:center;border:1px solid var(--rule);padding:6px 8px;flex-wrap:wrap}
.slot .ic{font:600 14px/1 var(--mono);color:var(--lamp);min-width:4.5em;text-align:center}
.slot>div{flex:1 1 160px;min-width:0}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cell{border:1px solid var(--rule);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cell .ic{font:600 18px/1 var(--mono);color:var(--lamp);padding:8px 0;border:1px dashed var(--rule);text-align:center}
.cell b{font-size:.95rem}
.cell .m{font-size:.84rem}
.cell button{align-self:flex-start}
/* map */
.mapbox{overflow-x:auto}
.mapbox svg{display:block;width:100%;max-width:600px;height:auto}
.mapbox .sea{fill:var(--seabg)}
.mapbox .land{fill:var(--land);stroke:var(--rule);stroke-width:1.5}
.mapbox .route{stroke:var(--mute);stroke-width:1;stroke-dasharray:3 4;fill:none}
.mapbox .node circle{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.mapbox .node.vis circle{fill:var(--lamp)}
.mapbox .node{cursor:pointer}
.mapbox .node:hover circle{stroke:var(--lamp);stroke-width:3}
.mapbox text{font:11px var(--mono);fill:var(--ink)}
.mapbox .home rect{fill:var(--lamp)}
/* tactical grid */
.tac{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.tac{grid-template-columns:minmax(0,1fr)}}
.grid{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:2px;max-width:420px;width:100%}
.grid.g9{grid-template-columns:repeat(9,minmax(0,1fr));max-width:340px}
.grid button{aspect-ratio:1;margin:0;padding:0;border:1px solid transparent;border-radius:0;background:var(--bg);font:600 clamp(13px,3.6vw,18px)/1 var(--mono);text-align:center;color:var(--mute);min-width:0}
.grid button:disabled{opacity:1}
.grid button:hover:not(:disabled){background:var(--rule);color:var(--ink)}
.grid .w{background:var(--rule);color:var(--ink)}
.grid .hc{color:var(--c-wood)}
.grid .wa{color:var(--sea);background:var(--seabg)}
.grid .ex{color:var(--good)}
.grid .re{background:color-mix(in srgb,var(--lamp) 16%,var(--bg))}
.grid .me{color:var(--lamp);border-color:var(--lamp);background:var(--panel)}
.grid .fo{color:var(--bad);border-color:var(--bad);background:var(--panel)}
.grid .sel{outline:2px solid var(--bad);outline-offset:-4px}
.grid .beam{color:var(--lamp)}
.grid .mir{color:var(--ink);border-color:var(--ink);background:var(--panel)}
.grid .src{color:var(--lamp)}
.pad{display:grid;grid-template-columns:repeat(3,52px);gap:4px;margin:8px 0}
.pad button{margin:0;text-align:center;padding:8px 0}
.foes{list-style:none;padding:0;margin:0 0 8px}
.foes li{padding:6px 0;border-top:1px dashed var(--rule)}
.foes li:first-child{border-top:0}
.foes .lt{font:600 16px var(--mono);color:var(--bad);margin-right:6px}
.ap{font:18px/1 var(--mono);color:var(--lamp);letter-spacing:3px;margin:4px 0 6px}
.clog{list-style:none;padding:0;margin:10px 0 0;font-size:.92rem;color:var(--mute)}
.clog li:first-child{color:var(--ink)}
.legend{font:12px/1.6 var(--mono);color:var(--mute);margin-top:6px}
input{font:15px var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--ink);padding:6px 8px;border-radius:2px;max-width:100%;width:240px}
input:focus-visible{outline:2px solid var(--lamp);outline-offset:1px}
.quote{font-style:italic;border-left:2px solid var(--lamp);padding-left:10px}
.hint{border-left:2px solid var(--c-lore);padding-left:10px;color:var(--c-lore);font-size:.94rem}
ul.plain{list-style:none;padding:0;margin:0}
ul.plain li{padding:6px 0;border-top:1px dashed var(--rule)}
ul.plain li:first-child{border-top:0}
.off{color:var(--mute);text-decoration:line-through}
.dials{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.dial{display:flex;flex-direction:column;align-items:center;border:1px solid var(--rule);padding:6px 10px;gap:4px;min-width:84px}
.dial b{font:600 15px var(--mono)}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
img.px{display:block}
.ri{display:inline-block!important;width:16px;height:16px;vertical-align:-3px;margin-right:3px}
@media (max-width:560px){#top .rn{display:none}}
.scene{width:100%;max-width:576px;height:auto;aspect-ratio:96/40;border:1px solid var(--rule);background:#16252e;margin:0 0 10px}
.twr img{width:192px;max-width:100%;height:auto;background:#0b1418;border:1px solid var(--rule)}
@media (max-width:620px){.twr{display:flex;justify-content:center}.twr img{width:144px}}
.face{width:64px;height:64px;border:1px solid var(--rule);background:#16252e;flex:none}
.cell .ic,.slot .ic{display:flex;justify-content:center;align-items:center;min-height:52px}
.ic img{width:36px;height:36px}
.slot .ic{min-width:48px;min-height:40px;border:1px dashed var(--rule)}
.slot .ic img{width:30px;height:30px}
.herofig{width:96px;height:96px;background:#16252e;border:1px solid var(--rule)}
.grid.px button{background-size:100% 100%;background-color:#16252e;image-rendering:pixelated;image-rendering:crisp-edges}
.grid.px button img{width:100%;height:100%;position:relative;z-index:2}
.grid.px button{overflow:visible}
.grid.px button:hover:not(:disabled){background-color:#16252e;background-size:100% 100%;filter:brightness(1.2)}
.gwrap{position:relative;width:100%}
.gwrap .grid{max-width:none}
.gfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible}
.gfx line{vector-effect:non-scaling-stroke;stroke-width:2.5;stroke-linecap:round}
.gfx .fire{stroke:#ff6b5e;stroke-dasharray:7 5}.gfx .aim{stroke:#f0b84a;stroke-dasharray:3 5}
.gfx .own{stroke:#7fe08c;stroke-dasharray:10 4}.gfx .own.no{stroke:#b9c4c7;stroke-dasharray:2 5}
@media (prefers-reduced-motion:no-preference){.gfx .fire,.gfx .aim,.gfx .own{animation:dash 1.1s linear infinite}}
@keyframes dash{to{stroke-dashoffset:-24}}
.gm{position:absolute;z-index:5;pointer-events:none;transform:translate(-50%,-50%)}
.gm svg{display:block;width:100%;height:auto}
.gm.lbl{font:700 11px/1 var(--mono);padding:2px 4px;background:rgba(11,20,24,.85);color:#f0b84a;border-radius:2px;white-space:nowrap}
.gm.lbl.ok{color:#7fe08c}.gm.lbl.bad{color:#ff8a80}
.fxl{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:visible}
.fxn{position:absolute;font:700 15px/1 var(--mono);color:#ffd27a;text-shadow:0 0 3px #000,0 1px 0 #000;white-space:nowrap;left:0;top:0}
.fxn.crit{color:#ff9a3d;font-size:19px}.fxn.hurt{color:#ff6b5e}.fxn.heal{color:#8fe39a}.fxn.miss{color:#d6dee0;font-size:12px}
.fxp{position:absolute;left:0;top:0;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff1c4;box-shadow:0 0 7px 3px rgba(255,200,90,.85)}
.fxp.cold{background:#dff4ff;box-shadow:0 0 8px 3px rgba(150,210,255,.9)}
.fxb{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(rgba(255,230,140,.95),rgba(255,140,40,.65) 45%,rgba(200,60,20,0) 72%)}
.fxb.cold{background:radial-gradient(rgba(220,240,255,.9),rgba(140,190,230,.5) 50%,rgba(100,150,200,0) 72%)}
.fxg{position:absolute;left:0;top:0;image-rendering:pixelated}
.grid .fogc::after{content:"";position:absolute;inset:-1px;z-index:3;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(210,224,228,.72),rgba(210,224,228,.3) 75%)}
@media (prefers-reduced-motion:no-preference){.grid .fogc::after{animation:fogd 4s ease-in-out infinite alternate}.grid .firec::after{animation:flick .45s infinite}}
@keyframes fogd{from{opacity:.7}to{opacity:1}}
.grid .firec::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 70%,rgba(255,200,80,.9),rgba(230,90,30,.55) 45%,rgba(200,60,20,0) 75%)}
.grid .smk::after{content:"";position:absolute;inset:-3px;z-index:3;pointer-events:none;background:radial-gradient(rgba(190,198,202,.8),rgba(190,198,202,.25) 72%)}
.tac.wide{grid-template-columns:minmax(0,1fr)}
#main.tin,#stage.tin{animation:tabin .26s ease-out}
.sub2{display:flex;flex-wrap:wrap;gap:0;margin-bottom:12px;border-bottom:2px solid var(--rule)}
.sub2 button{display:flex;align-items:center;gap:6px;margin:0 3px -2px 0;border:1px solid var(--rule);border-bottom:2px solid var(--rule);border-radius:6px 6px 0 0;background:var(--bg);color:var(--mute);font:600 14px/1.2 var(--serif);padding:7px 12px}
.sub2 button:hover:not(:disabled){background:var(--panel);color:var(--ink)}
.sub2 button.on{background:var(--panel);border-bottom-color:var(--panel);color:var(--ink);box-shadow:inset 0 3px 0 var(--lamp)}
.sub2 button img{width:18px;height:18px;image-rendering:pixelated}
.sub2 .dot{width:8px;height:8px;border-radius:50%;background:var(--lamp);display:inline-block}
.hcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.hport{width:104px;height:104px;border:3px double #b08a45;background:radial-gradient(#22394a,#0b1418);display:grid;place-items:center;border-radius:6px}
.hport img{width:96px;height:96px}
.hname{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:6px}.hname h2{margin:0}
.lvl{font:700 12px/1 var(--mono);background:#f0b84a;color:#0b1418;padding:4px 8px;border-radius:999px}
.schips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}

function pset(b,x,y,c){if(c==='.')return;if(b.k===1){x|=0;y|=0;if(x>=0&&y>=0&&x<b.w&&y<b.h)b.p[y*b.w+x]=c;return}
  if(b===EXB&&x===EXL&&y===EXT){b.p[EXY*b.W+EXX]=c;return}
  const k=b.k;x=Math.floor(x);y=Math.floor(y);const x0=Math.max(0,Math.round(x*k)),x1=Math.min(b.W,Math.round((x+1)*k)),y0=Math.max(0,Math.round(y*k)),y1=Math.min(b.H,Math.round((y+1)*k));
  for(let j=y0;j<y1;j++)for(let i=x0;i<x1;i++)b.p[j*b.W+i]=c}
function pget(b,x,y){if(b.k===1)return(x>=0&&y>=0&&x<b.w&&y<b.h)?b.p[y*b.w+x]:'.';if(b===EXB&&x===EXL&&y===EXT)return b.p[EXY*b.W+EXX];
  const hx=Math.floor((Math.floor(x)+.5)*b.k),hy=Math.floor((Math.floor(y)+.5)*b.k);return(hx>=0&&hy>=0&&hx<b.W&&hy<b.H)?b.p[hy*b.W+hx]:'.'}
function prect(b,x,y,w,h,c){if(b.k===1){for(let j=0;j<h;j++)for(let i=0;i<w;i++)pset(b,x+i,y+j,c);return}
  const k=b.k,x0=Math.round(x*k),x1=Math.round((x+Math.ceil(w))*k),y0=Math.round(y*k),y1=Math.round((y+Math.ceil(h))*k);for(let j=y0;j<y1;j++)for(let i=x0;i<x1;i++)phx(b,i,j,c)}

function hiRect(b,x,y,w,h,fn){const k=b.k||1,X0=Math.round(x*k),X1=Math.round((x+w)*k),Y0=Math.round(y*k),Y1=Math.round((y+h)*k);for(let j=Y0;j<Y1;j++)for(let i=X0;i<X1;i++){const c=fn(i,j,i/k,j/k);if(c)phx(b,i,j,c)}}

function pblit(b,rows,x,y,map){rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){let c=r[i];if(map&&map[c])c=map[c];pset(b,x+i,y+j,c)}})}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pnoise(b,x,y,w,h,c,dens,seed){const R=rng(seed);if(b.k!==1){const k=b.k,X0=Math.round(x*k),Y0=Math.round(y*k),X1=Math.round((x+w)*k),Y1=Math.round((y+h)*k);for(let j=Y0;j<Y1;j++)for(let i=X0;i<X1;i++)if(R()<dens)phx(b,i,j,c);return}for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(R()<dens)pset(b,x+i,y+j,c)}
function ppoly(b,pts,c){let y0=Infinity,y1=-Infinity;for(const p of pts){y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])}
  for(let y=Math.floor(y0);y<=Math.ceil(y1);y++){const xs=[];for(let i=0;i<pts.length;i++){const[a,b2]=[pts[i],pts[(i+1)%pts.length]];
    if((a[1]<=y+.5&&b2[1]>y+.5)||(b2[1]<=y+.5&&a[1]>y+.5)){xs.push(a[0]+(y+.5-a[1])*(b2[0]-a[0])/(b2[1]-a[1]))}}
    xs.sort((p,q)=>p-q);for(let k=0;k+1<xs.length;k+=2)for(let x=Math.round(xs[k]);x<Math.round(xs[k+1]);x++)pset(b,x,y,c)}}
function pline(b,x0,y0,x1,y1,c){if(b.k!==1){const k=b.k,f=v=>(v+.5)*k-.5,a=f(x0),bb=f(y0),cx=f(x1),cy=f(y1),n=Math.max(1,Math.round(Math.max(Math.abs(cx-a),Math.abs(cy-bb)))),st=Math.abs(cx-a)>=Math.abs(cy-bb);
    for(let i=0;i<=n;i++){const X=Math.round(a+(cx-a)*i/n),Y=Math.round(bb+(cy-bb)*i/n);phx(b,X,Y,c);if(st)phx(b,X,Y+1,c);else phx(b,X+1,Y,c)}return}const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1;for(let i=0;i<=n;i++)pset(b,Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),c)}
function dither(b,x,y,w,h,c,phase){if(b.k!==1){const k=b.k;for(let j=Math.round(y*k);j<Math.round((y+h)*k);j++)for(let i=Math.round(x*k);i<Math.round((x+w)*k);i++)if((i+j+(phase||0))%2===0)phx(b,i,j,c);return}for(let j=0;j<h;j++)for(let i=0;i<w;i++)if((i+j+(phase||0))%2===0)pset(b,x+i,y+j,c)}

function psky(b,hz,night){const W=b.w;prect(b,0,0,W,hz,night?'0':'1');
  const t1=Math.floor(hz*0.35),t2=Math.floor(hz*0.65);
  prect(b,0,t1,W,hz-t1,night?'1':'2');dither(b,0,t1-1,W,1,night?'1':'2');
  prect(b,0,t2,W,hz-t2,'3');dither(b,0,t2-1,W,1,'3');
  if(!night){prect(b,0,hz-3,W,3,'5');dither(b,0,hz-4,W,1,'5',1);dither(b,0,hz-1,W,1,'6')}}
function psea(b,y0,seed){const W=b.w,H=b.h;prect(b,0,y0,W,H-y0,'3');prect(b,0,y0+Math.floor((H-y0)*0.6),W,H,'2');
  const R=rng(seed||7);for(let k=0;k<W*(H-y0)/14;k++){const x=Math.floor(R()*W),y=y0+1+Math.floor(R()*(H-y0-1));const len=2+Math.floor(R()*4);
    for(let i=0;i<len;i++)pset(b,x+i,y,y>y0+(H-y0)*0.6?'3':'4');if(R()<0.25)pset(b,x+1,y-1,'6')}
  prect(b,0,y0,W,1,'4')}

function tile(kind,floor){const b=pbuf(16,16);const fl={sand:['b','a','e'],stone:['9','8','a'],plank:['d','c','e'],grass:['k','l','8']}[floor||'sand'];
  const base=()=>{prect(b,0,0,16,16,fl[0]);pnoise(b,0,0,16,16,fl[1],0.10,floor.length*31+3);pnoise(b,0,0,16,16,fl[2],0.05,77);
    if(floor==='plank'){for(let y=3;y<16;y+=5)prect(b,0,y,16,1,'c');pset(b,4,1,'9');pset(b,12,6,'9')}};
  if(kind==='floor'){base()}
  else if(kind==='rock'){base();ppoly(b,[[1,14],[2,6],[6,2],[11,3],[15,8],[15,14]],'9');ppoly(b,[[3,8],[6,4],[10,4],[8,8]],'a');ppoly(b,[[10,10],[15,9],[15,14],[9,14]],'8');pset(b,6,6,'b')}
  else if(kind==='wall'){prect(b,0,0,16,16,'1');for(let r=0;r<4;r++){const o=r%2?4:0;for(let x=-o;x<16;x+=8){prect(b,x+1,r*4+1,6,2,'8');prect(b,x+1,r*4+1,6,1,'9')}}}
  else if(kind==='crate'){base();prect(b,2,3,12,11,'c');prect(b,3,4,10,9,'d');prect(b,3,8,10,1,'c');prect(b,7,4,1,9,'c');prect(b,3,4,10,1,'e');prect(b,2,14,12,1,'8')}
  else if(kind==='water'){prect(b,0,0,16,16,'3');pnoise(b,0,0,16,16,'2',0.15,5);prect(b,2,4,4,1,'4');prect(b,9,9,5,1,'4');prect(b,4,13,3,1,'4');pset(b,10,8,'6');pset(b,3,3,'6')}
  else if(kind==='exit'){base();for(let i=0;i<4;i++){pset(b,9-i,4+i,'7');pset(b,9-i,11-i,'7');pset(b,13-i,4+i,'6');pset(b,13-i,11-i,'6')}}

  rampV(b,0,0,W,80,st.won?['B','C','1','2','3']:['A','B','C','1','2']);
  const R=rng(7);for(let i=0;i<70;i++){const x=Math.floor(R()*W),y=Math.floor(R()*60);pset(b,x,y,R()<.15?'y':R()<.5?'6':'5')}
  /* far islands */
  polyFill(b,[[150,80],[168,72],[186,74],[198,80]],(x,y)=>pset(b,x,y,'1'));polyFill(b,[[220,80],[236,70],[252,68],[268,75],[288,73],[288,80]],(x,y)=>pset(b,x,y,'1'));
  for(let x=168;x<186;x+=3)pset(b,x,73,'2');for(let x=236;x<266;x+=3)pset(b,x,70,'2');

  /* land */
  const land=[[0,160],[0,108],[22,100],[40,96],[96,100],[140,104],[190,110],[214,120],[232,136],[246,160]];
  polyFill(b,land,(x,y)=>pset(b,x,y,y<106?'N':'M'));

  const R3=rng(12);for(let i=0;i<50;i++){const x=Math.floor(R3()*200)+6,y=100+Math.floor(R3()*40);if(pget(b,x,y)==='M'||pget(b,x,y)==='N'||pget(b,x,y)==='L'){pset(b,x,y,'r');pset(b,x+1,y-1,'Z');pset(b,x-1,y-1,'r')}}
  /* foam along coast */
  for(let i=0;i<land.length-1;i++){const[a,c]=[land[i],land[i+1]];if(a[0]<140)continue;const n=Math.max(Math.abs(c[0]-a[0]),Math.abs(c[1]-a[1]));for(let k=0;k<=n;k++){const x=Math.round(a[0]+(c[0]-a[0])*k/n),y=Math.round(a[1]+(c[1]-a[1])*k/n);pset(b,x+1,y,'u');pset(b,x+2,y,'U');if(k%3===0)pset(b,x+3,y,'u')}}

  if(st.hearth)logs2(b,104,150,Math.min(9,1+Math.floor((st.wood||0)/25)));
  /* beam when won */
  if(st.won){for(let i=0;i<140;i++){const x=72+i,y0=26-i*0.22;for(let d=-1-i*0.06;d<=1+i*0.06;d++){const y=Math.round(y0+d);if(y>=0&&(i+y)%2===0)pset(b,x,y,i<60?'I':'h')}}
    for(let i=0;i<40;i++){const x=48-i,y0=26-i*0.22;for(let d=-1;d<=1;d++){const y=Math.round(y0+d);if(x>=0&&y>=0&&(x+y)%2===0)pset(b,x,y,'h')}}}

  if(st.boat){prect(b,204,128,22,4,'W');prect(b,206,132,18,2,'V');prect(b,204,128,22,1,'Y');prect(b,214,112,2,16,'X');polyFill(b,[[216,112],[226,126],[216,126]],(x,y)=>pset(b,x,y,(x+y)%5?'6':'5'))}
  if(st.schooner){const x=224,y=96;polyFill(b,[[x,y],[x+46,y],[x+40,y+8],[x+6,y+8]],(px,py)=>pset(b,px,py,py<y+2?'Y':'W'));prect(b,x+16,y-28,2,28,'X');prect(b,x+30,y-24,2,24,'X');

  /* people */
  for(let i=0;i<Math.min(6,st.pop||0);i++){const x=118+i*13,y=152-(i%2)*3;prect(b,x,y-6,2,2,'m');prect(b,x-1,y-4,4,3,['X','S','r','v','Y','T'][i]);prect(b,x,y-1,1,1,'x');prect(b,x+1,y-1,1,1,'x')}

function towerObj(st){const W=50,H=128,b=pbuf(W,H),F=st.floors||{};const cx=25;

  for(let y=30;y<H;y++){const hw=hwAt(y);for(let x=cx-hw;x<cx+hw;x++){const row=Math.floor((y-30)/4),off=row%2?3:0,mort=(y-30)%4===3||((x+off)%6===0);
      const shade=x<cx-hw+3?'G':x>cx+hw-5?'D':x>cx+hw-9?'E':'F';pset(b,x,y,mort?(shade==='D'?'x':'D'):shade)}}
  /* cracks when ruined */
  if(!st.won){pline(b,cx-6,60,cx-2,72,'D');pline(b,cx+4,84,cx+8,96,'D')}
  /* bands */
  for(const y of[56,82,104])prect(b,cx-hwAt(y)-1,y,hwAt(y)*2+2,2,'H');

  const winY={lantern:0,gallery:40,study:66,work:90};

  /* door */
  prect(b,cx-5,H-16,10,16,'x');if(st.hearth){prect(b,cx-4,H-14,8,14,'K');prect(b,cx-3,H-12,6,12,'J');prect(b,cx-2,H-6,4,6,'I')}prect(b,cx-6,H-17,12,1,'H');
  /* gallery & lantern room */
  prect(b,cx-15,28,30,3,'H');prect(b,cx-15,30,30,1,'E');for(let x=cx-14;x<cx+15;x+=3)prect(b,x,24,1,4,'G');prect(b,cx-15,23,30,1,'G');
  const lit=st.won,lantern=!!F.lantern;prect(b,cx-8,10,16,14,'E');
  for(let x=cx-7;x<cx+8;x++)for(let y=11;y<23;y++){const glass=(x-cx+7)%5!==4;pset(b,x,y,glass?(lit?(y<15?'I':'h'):lantern?'S':'B'):'z')}
  if(lit){prect(b,cx-2,14,4,6,'y');pset(b,cx-1,13,'I')}
  polyFill(b,[[cx-10,10],[cx,1],[cx+10,10]],(x,y)=>pset(b,x,y,x<cx?'z':'E'));prect(b,cx,0,1,2,'H');prect(b,cx-10,9,20,1,'D');
  return b}

function reqTick(){const now=Date.now();s.req=s.req||{};s.reqT=s.reqT||{};
  for(const f in FAC){if(!FAC[f].known()||(f==='silent'&&fac(f)<-39))continue;if(s.req[f])continue;if((s.reqT[f]||0)>now)continue;
    const L=REQS[f].filter(q=>Object.keys(q.give).every(k=>s.seen[k]));if(!L.length)continue;s.req[f]=Object.assign({},L[rnd(L.length)]);dirty=1}}
function folkTick(){if(!s.tabs.folk&&Object.keys(FAC).some(f=>FAC[f].known()))unlock('folk');if(s.tabs.folk)reqTick();
  if(s.f.gnat&&!s.f.evRef&&!s.cb&&!(s.dlg||[]).length&&Math.random()<0.003){s.f.evRef=1;s.dlg=s.dlg||[];s.dlg.push({k:'story',title:'Стукіт у двері',img:{t:'face',id:'gnat'},body:'<p>Уночі хтось стукає в двері маяка. На порозі — поранений Мовчун у мокрому плащі. «Гнат упав, ватага розбіглася. Мене шукають у Причалі. Пусти до вогню, хранителю».</p>',btns:[['Прихистити','evr','keep'],['Прогнати','evr','away'],['Видати селищу','evr','give']]})}
  if(s.f.people&&(s.pop||0)>=2&&!s.f.evFam&&s.met.hanna&&!s.cb&&!(s.dlg||[]).length&&Math.random()<0.002){s.f.evFam=1;s.dlg=s.dlg||[];s.dlg.push({k:'story',title:'Голод у Причалі',img:{t:'face',id:'hanna'},body:`<p>${P('Ганна')} приходить сама, що буває рідко: ${Q('Сіті порожні третій тиждень. Діти пухнуть з голоду. Хранителю, якщо можеш — поділися провізією')}.</p><p class="m">Просять 30 провізії. У тебе ${Math.floor(s.r.prov)}.</p>`,btns:[['Віддати провізію','evf','give'],['Відмовити','evf','no']]})}}
function rFolk(){let h=`<section><h2>Громади шхер${ih(`Допомога, вибори в розмовах і навіть те, як ти поводишся в бою, змінюють довіру. Довіра відкриває вигоди.`)}</h2><p class="hand">Люди пам’ятають, що ти зробив.</p></section><div class="fgrid">`;
  for(const f in FAC){const F=FAC[f];if(!F.known())continue;const v=fac(f),ri=rankI(v);
    const perks=F.perks.map(p=>{const on=p[0]>=0?v>=p[0]:v<=p[0];return`<li class="${on?'':'lk'}">${p[0]>=0?`від ${p[0]}: `:''}${p[1]}${on?' ✓':''}</li>`}).join('');
    const q=(s.req||{})[f];
    h+=`<div class="fcard"><div class="fh">${pimg(faceURL(F.face),56,56,'',F.n)}<div><h3>${F.n}${fresh9('fq:'+f+(q?q.n:''))}</h3><span class="rank r${ri}">${RANKS[ri][1]}</span> <span class="m">довіра ${v}</span></div></div>
      <div class="tbar" aria-hidden="true"><span class="zero"></span><span class="mk" style="left:${(v+100)/2}%"></span></div><p class="m" style="margin:0">${F.d}</p><ul class="perks">${perks}</ul>
      <div class="freq">${q?`<b>Прохання: ${q.n}</b><br><span class="m">Віддати ${costTxt(q.give)} → ${costTxt(q.rew)} і довіра +6${q.side?`, але ${q.side.map(([g,n])=>`${FAC[g].n} ${n}`).join(', ')}`:''}.</span><div class="act">${btn('Виконати','freq',f,{ok:()=>afford(q.give)})}${btn('Відмовитися','fdecl',f,{cls:'toggle'})}</div>`:(f==='silent'&&v<-39?'<span class="m">З тобою поки не розмовляють.</span>':'<span class="m">Зараз прохань немає. Загляни пізніше.</span>')}</div></div>`}
  return h+`</div>`}
function crabWarn(){s.dlg=s.dlg||[];s.dlg.push({k:'fight',crabw:1,title:'Щось лізе з прибою',img:{t:'spr',id:'crab'},body:`<p>Вода біля ніг закипає, і з прибою вилазить краб завбільшки з відро. Він клацає клешнями й явно вважає цей берег своїм. Рибалити він не дасть.</p><p class="m">Це перший бій. Поле поділене на клітинки. Ти ходиш і б’єш, витрачаючи очки дії. Коли вони закінчаться, тисни «Завершити хід», і тоді діє ворог. Над ворогом написано, що він зробить наприкінці ходу. Наведи курсор на клітинку, щоб побачити підказку.</p>`,btns:[['До бою','fightGo','crab1']]})}

const $=id=>document.getElementById(id);

function fr(n){return String(Math.round(n*100)/100).replace('.',',')}
function fmt(n){n=Math.floor(n+1e-9);return n>=10000?String(Math.round(n/100)/10).replace('.',',')+'к':String(n)}
function say(m,t='info'){if(!m)return;s.log.unshift({m,t,at:Date.now()});if(s.log.length>60)s.log.length=60;dirty=1}
function add(k,v){s.r[k]+=v;if(v>0){if(!s.seen[k]){s.seen[k]=1;dirty=1}if(s.tot[k]!==undefined)s.tot[k]+=v}}
function giveI(id,n=1){s.inv[id]=(s.inv[id]||0)+n;s.seenI=s.seenI||{};s.seenI[id]=1;const it=IT[id];s.pack=s.pack||[];s.belt=s.belt||[];
  if(it.slot==='weapon'||it.slot==='ranged'){if(!s.pack.includes(id)&&s.pack.length<packSlots())s.pack.push(id);if(!s.eq[it.slot]&&s.pack.includes(id))s.eq[it.slot]=id}
  else if(it.slot&&!s.eq[it.slot])s.eq[it.slot]=id;
  if(it.use&&!s.belt.includes(id)&&s.belt.length<beltSlots())s.belt.push(id);dirty=1}
function afford(c={},it={}){return Object.keys(c).every(k=>s.r[k]>=c[k])&&Object.keys(it).every(k=>(s.inv[k]||0)>=it[k])}
function pay(c={},it={}){paidN++;for(const k in c)s.r[k]-=c[k];for(const k in it)s.inv[k]-=it[k]}
function costTxt(c={},it={}){const ik=Object.keys(it),kn=ik.filter(k=>KN(k));return[...Object.keys(c).map(k=>R(k,fmt(c[k]))),...kn.map(k=>(it[k]>1?it[k]+' × ':'')+IT[k].n.toLowerCase()),...(kn.length<ik.length?['ще дещо, чого ти поки не знаєш']:[])].join(', ')}

function eqv(p){let v=0;for(const sl in s.eq){const id=s.eq[sl];if(id&&IT[id]&&IT[id][p])v+=IT[id][p]}return v}

  if(k==='per')v+=eqv('per');if(k==='stealth')v+=eqv('stealth');if(k==='mech'&&s.rs.mech)v+=1;
  if(k==='stealth'&&s.h.ft.shadow)v+=2;if(k==='speech'&&s.h.ft.tongue)v+=2;return v}
const maxHP=()=>15+5*s.h.a.con+3*(s.h.lvl-1)+eqv('hp')+(s.h.ft.tough?5:0)+(s.h.ft.iron?15:0);

const loadCap=()=>8+2*s.h.a.str+3*(s.f.pack||0);

const overPen=()=>{const o=carried()-loadCap();return o>0?Math.ceil(o/4):0};

function beam(){const g=LENSMAP;const M=s.mirrors;const pos={};
  for(let y=0;y<g.length;y++)for(let x=0;x<g[y].length;x++)if('ABCD'.includes(g[y][x]))pos[x+','+y]=g[y][x];
  let x=1,y=1,dx=1,dy=0;const path={};let out=false;
  for(let i=0;i<80;i++){x+=dx;y+=dy;const k=x+','+y;
    if(y<0||y>=g.length||x<0||x>=g[0].length)break;
    if(g[y][x]==='#'){if(y===0&&x===7&&dy===-1)out=true;break}
    const m=pos[k];if(m){if(M[m]==='/'){const t=dx;dx=-dy;dy=-t}else{const t=dx;dx=dy;dy=t}path[k]='m';continue}
    path[k]=dx?'-':'|'}
  return{path,out,pos}}

const flotURLmg=k=>pxURL('flot3:'+k,()=>flotObj3(k));
function mgFlot(k){const per=2.4,win=0.16+0.015*Math.max(0,(s.h.a.per||2)-2);let tries=3,ph=0,stage=1,hits=0,miss=0,nail=null,nailT=0,beat=0;
  const title={barrel:'Бочка в прибої',crate:'Ящик у прибої',cargo:'Вантаж у прибої',survivor:'Людина на уламку'}[k]||'Знахідка';
  const done=ok=>mgEnd(ok?1:0);const finish=res=>{mgMsg(res?'Чудово! Здобич більша.':'Хай так: витягнеш і без вправності.',res?'ok':'');done(res)};
  mgStart({type:'flot',title,hint:'Хвилі гойдають знахідку. Підчепи гаком, коли вона найближче до тебе — у світлій смузі.',
    field:`<div class="mgsea"><div class="mgzone"></div><img class="mgitem" src="${flotURLmg(k)}" alt=""><div class="mghook">⚓</div></div>`,
    init(){MG.st.textContent=`спроб: ${tries}`},
    tick(dt,tt){if(stage===1){ph=(tt%per)/per;const y=(Math.sin(ph*Math.PI*2)*0.5+0.5);MG.f.querySelector('.mgitem').style.top=(8+y*60)+'%';MG.near=y>1-win*2.2}
      else if(stage===2){if(k==='barrel'){const x=(Math.sin(tt*2.6)*0.5+0.5);MG.f.querySelector('.mgham').style.left=(10+x*76)+'%';MG.hx=x}
        else if(k==='crate'||k==='cargo'){nailT-=dt;if(nailT<=0){if(nail&&nail.parentNode){nail.remove();miss++;MG.st.textContent=`цвяхів: ${hits}/4`}if(hits+miss>=6){finish(hits>=3?1.6:0);return}nail=document.createElement('i');nail.className='mgnail';nail.style.left=(15+Math.random()*65)+'%';nail.style.top=(20+Math.random()*55)+'%';MG.f.querySelector('.mgcrate').appendChild(nail);nailT=0.95}}
        else if(k==='survivor'){const c=(tt%1.2)/1.2;beat=c;MG.f.querySelector('.mgpulse').style.transform=`scale(${0.4+c*1.2})`;MG.f.querySelector('.mgpulse').style.opacity=String(1-c)}}
      if(tt>30&&stage<3){stage=3;finish(0)}},
    down(e){if(stage===1){if(MG.near){stage=2;mgMsg('Підчепив!','ok');setTimeout(()=>stage2(),450);stage=1.5}else{tries--;MG.st.textContent=`спроб: ${tries}`;mgMsg('Мимо — хвиля відтягнула.');if(tries<=0){stage=3;finish(0)}}return}
      if(stage!==2)return;
      if(k==='barrel'){const zones=[0.2,0.5,0.8];const z=zones[hits];if(Math.abs(MG.hx-z)<0.09+0.01*Math.max(0,(s.h.a.str||2)-2)){hits++;MG.f.querySelectorAll('.mghoop')[hits-1].classList.add('off');mgMsg('Обруч злетів!','ok');if(hits>=3){stage=3;finish(1.6)}}else{miss++;mgMsg('Не туди.');if(miss>=4){stage=3;finish(0)}}MG.st.textContent=`обручів: ${hits}/3`}
      else if(k==='crate'||k==='cargo'){const tg=e&&e.target&&e.target.closest&&e.target.closest('.mgnail');const nn=tg||(e&&e.key?nail:null);if(nn&&nn.parentNode){nn.remove();nail=null;nailT=0.25;hits++;MG.st.textContent=`цвяхів: ${hits}/4`;mgMsg('Цвях вийшов!','ok');if(hits>=4){stage=3;finish(1.6)}}}
      else if(k==='survivor'){if(beat>0.8||beat<0.12){hits++;mgMsg('Тягни!','ok');MG.st.textContent=`ривків: ${hits}/4`;if(hits>=4){stage=3;finish(1.6)}}else{miss++;mgMsg(miss>=2?'Линва перетерлася об камінь…':'Зарано — линва ковзає.');if(miss>=2){stage=3;finish(0)}}}},
    end(res){act('flot',res>1?String(res):'1')}});
  function stage2(){if(!MG)return;stage=2;const f=MG.f;
    if(k==='barrel'){MG.el.querySelector('.mghint').textContent='Збий обручі: бий, коли молот над наступним обручем.';f.innerHTML=`<div class="mgbar"><img src="${flotURLmg('barrel')}" alt="" class="mgbig"><i class="mghoop" style="left:20%"></i><i class="mghoop" style="left:50%"></i><i class="mghoop" style="left:80%"></i><b class="mgham">▼</b></div>`;MG.st.textContent='обручів: 0/3'}
    else if(k==='crate'||k==='cargo'){MG.el.querySelector('.mghint').textContent='Підваж цвяхи: натискай на кожен, поки не сховався.';f.innerHTML=`<div class="mgcrate"><img src="${flotURLmg('crate')}" alt="" class="mgbig"></div>`;MG.st.textContent='цвяхів: 0/4'}
    else{MG.el.querySelector('.mghint').textContent='Тягни линву на гребені хвилі — коли коло найбільше.';f.innerHTML=`<div class="mgrope"><img src="${flotURLmg('survivor')}" alt="" class="mgbig"><i class="mgpulse"></i></div>`;MG.st.textContent='ривків: 0/4'}}}
function fishEnd(res,skip){if(res>0){const n=Math.round(5*wolf());add('fish',n);let x='';if(Math.random()<0.35){add('coin',20);x=` У череві — ${R('coin',20)}, хтось колись упустив гаманець.`}say(`${skip==='auto'?'Ти звично вивів велику рибу. ':''}Велика риба! +${R('fish',n)}.${x}`,'find')}
  else{add('fish',wolf());say(skip===1?'Ти відпустив велику рибу й витяг дрібну.':'Велика риба зірвалася, але дрібну ти таки витяг.','find')}}
/* Риба: плавна фізика. Утримання розганяє натяг, відпускання — гасить; ривки риби попереджені й наростають поступово. */
function mgFish(){const str=(s.h.a.str||2),lo=25,hi=Math.min(90,78+2*Math.max(0,str-2));
  let ten=45,v=0,prog=0,strain=0,hold=0,pullT=2.6+Math.random(),tele=0,pullL=0,pullF=0,fx=0.5,fy=0.8,ph=0,dir=1,el={};
  const tc=x=>x>hi?'#e5533a':x<lo?'#9ccbd8':'#a5d98e';
  mgStart({type:'fish',title:'Щось велике клює!',hint:'Тримай, щоб підтягувати; відпусти, щоб попустити линву. Коли риба шарпається — попускай.',
    field:`<div class="mgfish"><div class="mgwv"></div><svg class="mgline" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="94" y1="0" x2="50" y2="80" vector-effect="non-scaling-stroke"/></svg><img class="mgfi" src="${icoURL('fish')}" alt=""><div class="mgten"><i class="mggreen" style="left:${lo}%;width:${hi-lo}%"></i><i class="mgredz" style="left:${hi}%"></i><b class="mgneedle"></b></div><div class="mgprog"><i></i></div></div>`,
    init(){const f=MG.f;el={n:f.querySelector('.mgneedle'),p:f.querySelector('.mgprog i'),fi:f.querySelector('.mgfi'),ln:f.querySelector('.mgline line'),fs:f.querySelector('.mgfish'),ten:f.querySelector('.mgten')};MG.st.textContent='0%'},
    tick(dt,tt){
      if(tt>2.4&&!tele&&pullL<=0){pullT-=dt;if(pullT<=0){tele=0.65;el.fs.classList.add('tug');mgMsg('Риба шарпається!')}}
      if(tele>0){tele-=dt;if(tele<=0){tele=0;pullL=1.0;pullF=60+Math.random()*40}}
      let force=0;if(pullL>0){const k=Math.min(1,(1.0-pullL)/0.4)*Math.min(1,pullL/0.25);force=pullF*k;pullL-=dt;if(pullL<=0){pullT=1.3+Math.random()*1.8;el.fs.classList.remove('tug');if(MG.msg.textContent==='Риба шарпається!')mgMsg('')}}
      const acc=(hold?115:-90)+force-v*3.2;v+=acc*dt;ten+=v*dt;if(ten<0){ten=0;v=Math.max(0,v)}if(ten>104){ten=104;v=Math.min(0,v)}
      if(ten>hi){strain+=dt;el.ten.classList.add('hot')}else{strain=Math.max(0,strain-dt*0.7);el.ten.classList.remove('hot')}
      if(strain>1.1){mgMsg('Линва лопнула! Хоч дрібну рибину встиг витягти.');mgEnd(0);return}
      if(ten>=lo&&ten<=hi)prog+=11*dt;else if(ten<lo)prog=Math.max(0,prog-4*dt);
      ph+=dt*(pullL>0?5:1.6);const tx=0.5+Math.sin(ph)*0.32;dir=tx>fx?1:-1;fx+=(tx-fx)*Math.min(1,dt*3);fy=0.82-Math.min(100,prog)/100*0.5;
      el.n.style.left=Math.min(100,ten)+'%';el.p.style.width=Math.min(100,prog)+'%';
      el.fi.style.left=(fx*100)+'%';el.fi.style.top=(fy*100)+'%';el.fi.style.transform=`translate(-50%,-50%) scaleX(${-dir})${pullL>0?` rotate(${Math.sin(tt*30)*8}deg)`:''}`;
      el.ln.setAttribute('x2',(fx*100).toFixed(1));el.ln.setAttribute('y2',(fy*100).toFixed(1));el.ln.style.stroke=tc(ten);
      MG.st.textContent=`${Math.floor(Math.min(100,prog))}%`;if(prog>=100){mgMsg('Ось вона!','ok');mgEnd(1);return}
      if(tt>32){mgMsg('Риба втомила тебе й зірвалася.');mgEnd(0)}},
    down(){hold=1;MG.f.classList.add('hold')},up(){hold=0;if(MG)MG.f.classList.remove('hold')},
    end:fishEnd})}

function mgForge(id){let strikes=0,good=0,heat=0;const per=1.7,sm=id==='smith';

/* ============ ПАНЕЛЬ НАЛАГОДЖЕННЯ ============
   Відкривається, якщо додати до адреси ?debug або #debug. Гравці її не бачать.
   Швидко переносить у потрібний стан: ресурси, вкладки, міні-ігри, набіг, перемотка часу, збереження. */
const DBG_ON=typeof location!=='undefined'&&/[?&#]debug\b/.test(location.search+location.hash);
const DBG=[
  ['Ресурси +500',()=>{for(const k of RES){s.seen[k]=1;s.r[k]=(s.r[k]||0)+500}}],
  ['Відкрити все',()=>{const F=s.f;Object.assign(F,{looked:1,lk:1,wreck:1,rod:1,crab1:1,people:1,boat:1,siege1:1,mlaNote:1});s.b.hearth=Math.max(3,s.b.hearth||0);
    for(const fl of['work','gallery','study','lantern'])s.floors[fl]=s.floors[fl]||1;s.pop=Math.max(3,s.pop||0);s.b.house=Math.max(2,s.b.house||0);for(const t of TABS)s.tabs[t[0]]=1;if(!s.h.bg)s.h.bg='old';s.nvU.gear=1}],
  ['Герой +1 рівень',()=>xp(need(s.h.lvl)-s.h.xp+1)],
  ['Риба',()=>mgFish()],['Бочка',()=>mgFlot('barrel')],['Ящик',()=>mgFlot('crate')],['Людина',()=>mgFlot('survivor')],
  ['Кування',()=>mgForge('smith')],['Клює велика',()=>{s.f.rod=1;s.bite={until:Date.now()+30000};s.tab='shore'}],['Заготовка',()=>{s.b.forge=s.b.forge||1;s.hot={until:Date.now()+30000};s.tab='home'}],
  ['Знахідка в прибої',()=>{s.floors.gallery=1;const ks=['crate','barrel','cargo','bottle','survivor'];s.flot={k:ks[Math.floor(Math.random()*ks.length)],until:Date.now()+180000};s.tab='shore'}],
  ['Мла +25',()=>{s.threat=Math.min(100,(s.threat||0)+25)}],
  ['Набіг зараз',()=>{s.f.siege1=1;s.threat=100;s.lastAct=Date.now();raidCheck()}],
  ['Ніч',()=>{s.dbgPh='n'}],['Сутінки',()=>{s.dbgPh='d'}],['День',()=>{s.dbgPh='y'}],['Справжній час',()=>{s.dbgPh=''}],['+10 хв',()=>dbgSkip(600)],['+1 год',()=>dbgSkip(3600)],
  ['Події в дзвіночок',()=>{dlg({k:'info',title:'Перевірка дзвіночка',body:'<p>Перша подія.</p>'});dlg({k:'world',title:'Ще одна подія',body:'<p>Друга.</p>'});s.bellHold=1}],
  ['Скинути звички',()=>{s.mgW={};s.mgUn={};s.mgHab={};s.mgSeen={}}],
];
/* Перемотка: гра живе так, ніби минув час; таймери подій теж зсуваються. */
function dbgSkip(sec){for(let r=sec;r>0;r-=5)produce(Math.min(5,r));const ms=sec*1000;for(const k in s.cd)s.cd[k]-=ms;
  for(const k of['flotT','shipT','lostT'])if(s[k])s[k]-=ms;for(const e of s.exp||[])e.until-=ms;checks();say(`Налагодження: минуло ${sec>=3600?sec/3600+' год':sec/60+' хв'}.`,'world')}
function dbgUI(){if(!DBG_ON||typeof document==='undefined'||!document.body||!document.body.appendChild)return;const el=document.createElement('div');el.id='dbg';
  el.innerHTML=`<details><summary>Налагодження</summary><div class="dbgb">${DBG.map((d,i)=>`<button type="button" data-dbg="${i}">${d[0]}</button>`).join('')}</div>
    <p class="dbgl">Збереження (для звіту про баг або щоб перенести гру):</p><textarea id="dbgSave" rows="3" spellcheck="false" aria-label="Збереження"></textarea>
    <div class="dbgb"><button type="button" id="dbgOut">Показати збереження</button><button type="button" id="dbgCopy">Копіювати</button><button type="button" id="dbgIn">Завантажити з поля</button></div><p class="dbgl" id="dbgMsg"></p></details>`;
  document.body.appendChild(el);const msg=t=>{el.querySelector('#dbgMsg').textContent=t},ta=el.querySelector('#dbgSave');
  el.querySelectorAll('[data-dbg]').forEach(b=>b.onclick=()=>{try{DBG[+b.dataset.dbg][1]();dirty=1;render();save();msg('Готово: '+DBG[+b.dataset.dbg][0])}catch(e){msg('Помилка: '+e.message)}});
  el.querySelector('#dbgOut').onclick=()=>{save();ta.value=btoa(unescape(encodeURIComponent(JSON.stringify(s))));msg('Збереження в полі. Скопіюй і встав у звіт про баг.')};
  el.querySelector('#dbgCopy').onclick=()=>{if(!ta.value){save();ta.value=btoa(unescape(encodeURIComponent(JSON.stringify(s))))}const ok=()=>msg('Скопійовано.'),no=()=>{ta.select();msg('Виділено — скопіюй вручну.')};try{navigator.clipboard.writeText(ta.value).then(ok,no)}catch(e){no()}};
  el.querySelector('#dbgIn').onclick=()=>{try{const raw=ta.value.trim(),txt=raw.startsWith('{')?raw:decodeURIComponent(escape(atob(raw)));JSON.parse(txt);save=function(){};localStorage.setItem(KEY,txt);msg('Завантажено. Перезапускаю…');setTimeout(()=>location.reload(),300)}catch(e){msg('Не вдалося прочитати збереження.')}}}
dbgUI();
