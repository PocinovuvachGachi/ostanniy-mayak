name: Перевірка
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/run.js
      - name: Зібрана гра відповідає src/
        run: git diff --exit-code docs/ || (echo "docs/ не оновлено — запусти python3 build.py і закоміть" && exit 1)
